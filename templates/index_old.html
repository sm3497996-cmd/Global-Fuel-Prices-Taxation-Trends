<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Fuel Prices Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5fb;
            color: #172554;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 24px 6%;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        header p {
            color: #dbeafe;
            line-height: 1.5;
        }

        main {
            width: 100%;
            max-width: 100%;
            margin: 20px auto;
            padding: 0 10px;
        }

        .dashboard-card {
            width: 100%;
            background: white;
            padding: 8px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
        }

        .dashboard-card h2 {
            margin-bottom: 12px;
            font-size: 20px;
        }

        iframe {
            display: block;
            width: 100%;
            height: 950px;
            border: none;
        }


        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <header>
        <h1>Global Fuel Prices & Taxation Trends</h1>
        <p>Explore global petrol prices, diesel prices, fuel trends and taxation insights.</p>
    </header>

    <main>
        <section class="dashboard-card">
            <h2>Interactive Tableau Dashboard</h2>

            <iframe
                src="https://public.tableau.com/views/GlobalFuelPricesandTaxationTrends_17930838394600/Dashboard1?:showVizHome=no"
                title="Global Fuel Prices Tableau Dashboard" allowfullscreen>
            </iframe>
        </section>
    </main>

    <footer>
        Global Fuel Prices and Taxation Trends | Data Analytics Project
    </footer>
</body>

</html>
